<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Under Maintenance</title>

<style>
body{
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#ffffff;
    font-family:Arial, sans-serif;
    text-align:center;
}

/* Loader */
.loader {
    border: 6px solid #f3f3f3;
    border-top: 6px solid #000;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Text */
.container{
    max-width: 500px;
    padding:20px;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

p{
    font-size:16px;
    color:#444;
    margin:8px 0;
}

</style>
</head>

<body>

<div class="container">
    
    <div class="loader"></div>

    <h1>🚧 Website Under Maintenance</h1>

    <p><b>English:</b> This website is temporarily unavailable. We are working on improvements and it will be back soon.</p>

    <p><b>Hinglish:</b> Ye website abhi thodi der ke liye band hai. Hum ispe kaam kar rahe hain, jaldi hi fix ho jayegi.</p>

</div>

</body>
</html>
